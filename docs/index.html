<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小孩数学空间</title>
<style>
  :root{
    color-scheme: light;
    --bg:#FFF9F0;
    --text:#2B2118;
    --dim:#7A6A58;
    --border:#F0E2CD;
    --accent:#FF8A00;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Yuanti SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer;min-height:2.25rem}
  @media (min-width:768px){ button, input{min-height:2.75rem} }
  button:focus-visible, input:focus-visible{
    outline:3px solid var(--accent);outline-offset:2px;
  }

  /* ---------- sticky header ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(255,249,240,.82);
    -webkit-backdrop-filter:blur(12px) saturate(1.4);
    backdrop-filter:blur(12px) saturate(1.4);
    border-bottom:1px solid rgba(240,226,205,.7);
    padding-top:env(safe-area-inset-top);
  }
  .wrap{margin:0 auto;width:100%;max-width:768px;padding:12px 16px 16px}
  @media (min-width:768px){ .wrap{max-width:1240px} }
  h1.page-title{font-size:28px;font-weight:900;letter-spacing:.02em}
  h1.page-title .sub{font-size:15px;font-weight:700;color:var(--dim);margin-left:8px}
  .search-row{display:flex;align-items:center;gap:8px;margin-top:10px}
  #search{
    flex:1;min-width:0;
    border:3px solid var(--border);border-radius:999px;
    background:#fff;padding:8px 16px;
    font-size:17px;color:var(--text);outline:none;
    font-family:inherit;
  }
  #search::placeholder{color:#B8A88F}
  #search:focus{border-color:var(--accent)}
  @media (min-width:768px){ #search{max-width:400px} }
  @media (min-width:1024px){ #search{max-width:460px} }

  /* ---------- category fold header ---------- */
  .fold-head{
    display:flex;align-items:center;gap:8px;margin-top:12px;
    min-height:40px;padding:6px 4px;background:none;border:none;
    font-size:16px;font-weight:800;color:var(--text);text-align:left;
  }
  .fold-head .fold-tri{font-size:13px;color:var(--accent)}

  /* ---------- chips: capsule + chunky bottom edge ---------- */
  .chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
  .chip{
    border:2px solid;border-radius:999px;background:#fff;
    padding:6px 16px;font-size:16px;font-weight:700;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .chip:active{transform:translateY(2px)}

  /* ---------- main / grid ---------- */
  main .wrap{padding-top:8px;padding-bottom:64px}
  .count-line{font-size:15px;font-weight:700;color:var(--dim);margin-bottom:12px}
  .grid{
    display:grid;gap:20px;grid-template-columns:1fr;
    align-items:stretch;
  }
  @media (min-width:640px){ .grid{grid-template-columns:repeat(2,1fr)} }
  @media (min-width:768px){ .grid{grid-template-columns:repeat(3,1fr)} }
  @media (min-width:1000px){ .grid{grid-template-columns:repeat(4,1fr)} }
  @media (min-width:1280px){ .grid{grid-template-columns:repeat(5,1fr)} }
  .empty{padding:48px 0;text-align:center;font-size:19px;font-weight:700;color:var(--dim)}
  .empty button{
    margin-top:16px;border:2px solid var(--accent);border-radius:999px;
    background:var(--accent);color:#fff;padding:8px 22px;
    font-size:16px;font-weight:800;
    box-shadow:0 4px 0 #D96F00;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .empty button:active{transform:translateY(2px);box-shadow:0 2px 0 #D96F00}

  /* ---------- card: regular grid, aligned bottoms ---------- */
  .card{
    display:flex;flex-direction:column;height:100%;overflow:hidden;
    background:#fff;border:3px solid;border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(43,33,24,.05), 0 8px 24px rgba(43,33,24,.08);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  @media (hover:hover){
    .card:hover{
      transform:translateY(-4px);
      box-shadow:0 2px 4px rgba(43,33,24,.06), 0 16px 32px rgba(43,33,24,.14);
    }
  }
  .card .img-btn{
    display:block;width:100%;border:none;padding:0;min-height:0;
    aspect-ratio:4/3;background:#FBF6EC;flex-shrink:0;
  }
  .card .img-btn img{
    display:block;width:100%;height:100%;object-fit:contain;
  }
  .card .body{display:flex;flex:1;flex-direction:column;padding:16px}
  .pill{
    align-self:flex-start;border-radius:999px;padding:4px 12px;
    font-size:14px;font-weight:800;color:#fff;
  }
  .card h2{
    margin-top:8px;font-size:22px;font-weight:800;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;
  }
  @media (min-width:768px){ .card h2{font-size:24px} }
  .card .points{
    margin-top:8px;font-size:17px;line-height:1.7;white-space:pre-line;
    flex:1;
  }
  @media (min-width:768px){ .card .points{font-size:18px} }

  /* ---------- practice ---------- */
  .practice{margin-top:14px;border-top:2px dashed var(--border);padding-top:12px}
  .practice h3{font-size:16px;font-weight:800;margin-bottom:4px}
  .pq{margin-top:10px}
  .pq .q{font-size:16px;line-height:1.65;font-weight:600}
  .pq .q .no{
    display:inline-block;min-width:22px;height:22px;line-height:22px;
    text-align:center;border-radius:50%;color:#fff;font-size:13px;
    font-weight:800;margin-right:6px;vertical-align:2px;
  }
  .pq .ans-btn{
    margin-top:6px;border:2px solid;border-radius:999px;background:#fff;
    padding:5px 16px;font-size:15px;font-weight:800;min-height:2.25rem;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .pq .ans-btn:active{transform:translateY(2px)}
  .pq .ans{
    display:none;margin-top:8px;background:#FBF6EC;border-radius:12px;
    padding:10px 12px;font-size:16px;line-height:1.7;white-space:pre-line;
  }
  .pq .ans.open{display:block}
  .pq .ans .ans-label{font-weight:800}
  footer{padding:0 16px 40px;text-align:center;font-size:14px;color:var(--dim)}

  /* ---------- back to top ---------- */
  #toTop{
    position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:30;width:48px;height:48px;min-height:48px;border-radius:50%;
    border:2px solid var(--accent);background:var(--accent);color:#fff;
    font-size:22px;font-weight:900;line-height:1;
    box-shadow:0 4px 0 #D96F00, 0 10px 24px rgba(43,33,24,.18);
    opacity:0;pointer-events:none;transform:translateY(8px);
    transition:opacity .2s ease, transform .2s ease;
  }
  #toTop.show{opacity:1;pointer-events:auto;transform:translateY(0)}
  #toTop:active{transform:translateY(2px)}

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed;inset:0;z-index:50;display:none;
    flex-direction:column;background:rgba(0,0,0,.95);
  }
  .lightbox.open{display:flex}
  .lightbox .bar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:calc(8px + env(safe-area-inset-top)) 16px 8px;
  }
  .lightbox .bar p{
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:17px;font-weight:700;color:#fff;
  }
  .lightbox .bar button{
    flex-shrink:0;border:none;border-radius:999px;
    background:rgba(255,255,255,.15);color:#fff;
    padding:8px 16px;font-size:17px;font-weight:700;
  }
  .lightbox .bar button:active{transform:scale(.95)}
  .lightbox .stage{
    position:relative;flex:1;min-height:0;
    display:flex;align-items:center;justify-content:center;
    overflow:auto;padding:12px;
  }
  .lightbox .stage img{max-width:92vw;max-height:100%;object-fit:contain}
  .lightbox .nav{
    position:absolute;top:50%;transform:translateY(-50%);
    width:48px;height:48px;min-height:48px;border-radius:50%;
    border:none;background:rgba(255,255,255,.18);color:#fff;
    font-size:26px;font-weight:900;line-height:1;z-index:2;
  }
  .lightbox .nav:active{transform:translateY(-50%) scale(.94)}
  .lightbox .nav.prev{left:10px}
  .lightbox .nav.next{right:10px}
  .lightbox .caption{
    flex-shrink:0;max-height:26vh;overflow:auto;
    padding:10px 20px calc(14px + env(safe-area-inset-bottom));
    color:#fff;
  }
  .lightbox .caption h3{font-size:18px;font-weight:800;line-height:1.4}
  .lightbox .caption p{
    margin-top:6px;font-size:16px;line-height:1.7;white-space:pre-line;
    color:rgba(255,255,255,.88);
  }

  /* ---------- topic cards （专题） ---------- */
  .pill-row{display:flex;align-items:center}
  .topic-badge{
    margin-left:8px;border:2px dashed;border-radius:999px;
    padding:3px 10px;font-size:13px;font-weight:800;background:#fff;
  }
  .card .topic-cover{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    width:100%;border:none;border-bottom:3px dashed;padding:16px;min-height:0;
    aspect-ratio:4/3;background:#FBF6EC;flex-shrink:0;font-family:inherit;
  }
  .topic-cover .tc-big{font-size:30px;font-weight:900;letter-spacing:.06em}
  .topic-cover .tc-sub{font-size:15px;font-weight:700;color:var(--dim)}

  /* ---------- topic viewer ---------- */
  .viewer{
    position:fixed;inset:0;z-index:60;display:none;
    flex-direction:column;background:var(--bg);
  }
  .viewer.open{display:flex}
  .viewer .bar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:calc(8px + env(safe-area-inset-top)) 16px 8px;
    border-bottom:3px solid var(--border);background:var(--bg);flex-shrink:0;
  }
  .viewer .bar p{
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:18px;font-weight:800;
  }
  .viewer .bar button{
    flex-shrink:0;border:none;border-radius:999px;
    background:#2B2118;color:#fff;padding:8px 18px;font-size:16px;font-weight:700;
  }
  .viewer .bar button:active{transform:scale(.95)}
  .viewer iframe{flex:1;min-height:0;width:100%;border:0;background:#fff}
  .viewer .comic-stage{
    flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    overflow:auto;background:#2B2118;padding:8px;
  }
  .viewer .comic-stage img{max-width:100%;max-height:100%;object-fit:contain}
  .viewer .comic-nav{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:3px solid var(--border);background:var(--bg);
  }
  .viewer .comic-nav button{
    border-radius:999px;padding:8px 20px;font-size:17px;font-weight:800;
  }
  .viewer .comic-nav .prev-btn{border:3px solid var(--border);background:#fff;color:var(--text)}
  .viewer .comic-nav .next-btn{border:3px solid var(--accent);background:var(--accent);color:#fff}
  .viewer .comic-nav button:disabled{opacity:.4}
  .viewer .comic-nav .page-no{font-size:16px;font-weight:700;color:var(--dim)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1 class="page-title">小孩数学空间<span class="sub">知识卡片墙</span></h1>
    <div class="search-row">
      <label for="search" style="position:absolute;left:-9999px">搜索卡片</label>
      <input id="search" type="search" placeholder="搜一搜：十字相乘、括号…" autocomplete="off">
    </div>
    <button type="button" class="fold-head" id="chipFold" aria-expanded="false" aria-controls="chips"><span id="chipFoldLabel">分类：全部</span><span class="fold-tri" id="chipFoldTri" aria-hidden="true">▶</span></button>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="count-line" id="countLine" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">
      <p>没找到这样的卡片，换个词试试，或者看看其他分类。</p>
      <button type="button" id="clearSearch">清除搜索</button>
    </div>
  </div>
</main>

<footer>静态网页版：只能看卡片；要加卡、改卡，请回到「小孩数学空间」里操作。</footer>

<button type="button" id="toTop" aria-label="回到顶部">↑</button>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <div class="bar">
    <p id="lightboxTitle"></p>
    <button type="button" id="lightboxClose">关闭</button>
  </div>
  <div class="stage" id="lightboxStage">
    <button type="button" class="nav prev" id="lbPrev" aria-label="上一张">‹</button>
    <img id="lightboxImg" src="" alt="">
    <button type="button" class="nav next" id="lbNext" aria-label="下一张">›</button>
  </div>
  <div class="caption">
    <h3 id="lightboxCapTitle"></h3>
    <p id="lightboxCapPoints"></p>
  </div>
</div>

<div class="viewer" id="topicViewer" role="dialog" aria-modal="true">
  <div class="bar">
    <p id="viewerTitle"></p>
    <button type="button" id="viewerClose">关闭</button>
  </div>
  <iframe id="viewerFrame" title="专题内容" sandbox="allow-scripts" style="display:none"></iframe>
  <div class="comic-stage" id="comicStage" style="display:none">
    <img id="comicImg" src="" alt="漫画页">
  </div>
  <div class="comic-nav" id="comicNav" style="display:none">
    <button type="button" class="prev-btn" id="comicPrev">← 上一页</button>
    <span class="page-no" id="comicPageNo"></span>
    <button type="button" class="next-btn" id="comicNext">下一页 →</button>
  </div>
</div>

<script src="data.js"></script>
<script>
(function () {
  var CATEGORIES = [
    { name: "乘法公式", color: "#FF5A5F" },
    { name: "因式分解", color: "#2E9BFF" },
    { name: "方程",     color: "#8B5CF6" },
    { name: "数与计算", color: "#22B573" },
    { name: "几何",     color: "#00A896" },
    { name: "应用题",   color: "#FF6FA5" },
    { name: "编程",     color: "#D9930D" },
    { name: "整式运算", color: "#FF8A00" },
    { name: "数学漫画", color: "#FF6FA5" }
  ];
  var colorOf = {};
  CATEGORIES.forEach(function (c) { colorOf[c.name] = c.color; });

  function darken(hex, f) {
    var n = parseInt(hex.slice(1), 16);
    var r = Math.round(((n >> 16) & 255) * f);
    var g = Math.round(((n >> 8) & 255) * f);
    var b = Math.round((n & 255) * f);
    return "rgb(" + r + "," + g + "," + b + ")";
  }

  var cards = window.CARD_DATA || [];
  var selected = "all";
  var query = "";

  var chipsEl = document.getElementById("chips");
  var foldEl = document.getElementById("chipFold");
  var foldLabel = document.getElementById("chipFoldLabel");
  var foldTri = document.getElementById("chipFoldTri");
  var chipsOpen = false;
  try { chipsOpen = localStorage.getItem("km-chips-open") === "1"; } catch (e) {}
  function applyFold() {
    chipsEl.style.display = chipsOpen ? "" : "none";
    foldTri.textContent = chipsOpen ? "▼" : "▶";
    foldEl.setAttribute("aria-expanded", chipsOpen ? "true" : "false");
    foldLabel.textContent = "分类：" + (selected === "all" ? "全部" : selected);
  }
  foldEl.addEventListener("click", function () {
    chipsOpen = !chipsOpen;
    try { localStorage.setItem("km-chips-open", chipsOpen ? "1" : "0"); } catch (e) {}
    applyFold();
  });
  var gridEl = document.getElementById("grid");
  var countEl = document.getElementById("countLine");
  var emptyEl = document.getElementById("empty");
  var searchEl = document.getElementById("search");

  function countFor(name) {
    return cards.filter(function (c) { return c.category === name; }).length;
  }

  function styleChip(b, color, active) {
    var edge = darken(color, 0.72);
    if (active) {
      b.style.backgroundColor = color;
      b.style.borderColor = color;
      b.style.color = "#fff";
      b.style.boxShadow = "0 4px 0 " + edge;
    } else {
      b.style.backgroundColor = "#fff";
      b.style.borderColor = color;
      b.style.color = color;
      b.style.boxShadow = "0 4px 0 " + edge;
    }
  }

  function renderChips() {
    chipsEl.innerHTML = "";
    var all = document.createElement("button");
    all.type = "button";
    all.className = "chip all";
    all.textContent = "全部（" + cards.length + "）";
    all.setAttribute("aria-pressed", selected === "all" ? "true" : "false");
    if (selected === "all") {
      styleChip(all, "#2B2118", true);
    } else {
      all.style.backgroundColor = "#fff";
      all.style.borderColor = "#E4D5BC";
      all.style.color = "#2B2118";
      all.style.boxShadow = "0 4px 0 #D8C6A4";
    }
    all.addEventListener("click", function () { selected = "all"; render(); });
    chipsEl.appendChild(all);
    CATEGORIES.forEach(function (cat) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      var active = selected === cat.name;
      b.setAttribute("aria-pressed", active ? "true" : "false");
      styleChip(b, cat.color, active);
      b.textContent = cat.name + "（" + countFor(cat.name) + "）";
      b.addEventListener("click", function () { selected = cat.name; render(); });
      chipsEl.appendChild(b);
    });
    applyFold();
  }

  function visibleCards() {
    var q = query.trim().toLowerCase();
    return cards.filter(function (c) {
      if (selected !== "all" && c.category !== selected) return false;
      if (!q) return true;
      return c.title.toLowerCase().indexOf(q) !== -1 ||
             c.points.toLowerCase().indexOf(q) !== -1;
    });
  }

  var currentList = [];

  function renderCards() {
    var list = visibleCards();
    currentList = list;
    gridEl.innerHTML = "";
    list.forEach(function (card, idx) {
      var color = colorOf[card.category] || "#FF8A00";
      var article = document.createElement("article");
      article.className = "card";
      article.style.borderColor = color;

      if (card.kind === "page" || card.kind === "comic") {
        var cover = document.createElement("button");
        cover.type = "button";
        cover.className = "topic-cover";
        cover.style.borderColor = color;
        cover.setAttribute("aria-label", "打开专题：" + card.title);
        var big = document.createElement("span");
        big.className = "tc-big";
        big.style.color = color;
        big.textContent = card.kind === "comic" ? "漫画" : "专题";
        cover.appendChild(big);
        var sub = document.createElement("span");
        sub.className = "tc-sub";
        sub.textContent = card.kind === "comic"
          ? "共 " + (card.pages ? card.pages.length : 0) + " 页 · 点开翻页看"
          : "点开在页面里看 / 玩";
        cover.appendChild(sub);
        (function (c) {
          cover.addEventListener("click", function () { openTopic(c); });
        })(card);
        article.appendChild(cover);
      } else {
        var imgBtn = document.createElement("button");
        imgBtn.type = "button";
        imgBtn.className = "img-btn";
        imgBtn.setAttribute("aria-label", "放大看图：" + card.title);
        var img = document.createElement("img");
        img.src = card.image;
        img.alt = card.title;
        img.decoding = "async";
        if (idx < 10) {
          img.loading = "eager";
        } else {
          img.loading = "lazy";
        }
        imgBtn.appendChild(img);
        imgBtn.addEventListener("click", function () { openLightbox(idx); });
        article.appendChild(imgBtn);
      }

      var body = document.createElement("div");
      body.className = "body";
      var pillRow = document.createElement("div");
      pillRow.className = "pill-row";
      var pill = document.createElement("span");
      pill.className = "pill";
      pill.style.backgroundColor = color;
      pill.textContent = card.category;
      pillRow.appendChild(pill);
      if (card.kind) {
        var tbadge = document.createElement("span");
        tbadge.className = "topic-badge";
        tbadge.style.borderColor = color;
        tbadge.style.color = color;
        tbadge.textContent = "专题";
        pillRow.appendChild(tbadge);
      }
      body.appendChild(pillRow);
      var h = document.createElement("h2");
      h.textContent = card.title;
      body.appendChild(h);
      var p = document.createElement("p");
      p.className = "points";
      p.textContent = card.points;
      body.appendChild(p);

      if (card.practice && card.practice.length) {
        var prac = document.createElement("div");
        prac.className = "practice";
        var ph = document.createElement("h3");
        ph.style.color = color;
        ph.textContent = "练一练（先自己想，再看答案）";
        prac.appendChild(ph);
        card.practice.forEach(function (item, qi) {
          var qd = document.createElement("div");
          qd.className = "pq";
          var qp = document.createElement("p");
          qp.className = "q";
          var no = document.createElement("span");
          no.className = "no";
          no.style.backgroundColor = color;
          no.textContent = qi + 1;
          qp.appendChild(no);
          qp.appendChild(document.createTextNode(item.q));
          qd.appendChild(qp);
          var ans = document.createElement("div");
          ans.className = "ans";
          var lab = document.createElement("span");
          lab.className = "ans-label";
          lab.style.color = color;
          lab.textContent = "答案：";
          ans.appendChild(lab);
          ans.appendChild(document.createTextNode(item.a));
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "ans-btn";
          btn.style.borderColor = color;
          btn.style.color = color;
          btn.style.boxShadow = "0 3px 0 " + darken(color, 0.72);
          btn.textContent = "看答案";
          btn.setAttribute("aria-expanded", "false");
          btn.addEventListener("click", function () {
            var open = ans.classList.toggle("open");
            btn.textContent = open ? "收起答案" : "看答案";
            btn.setAttribute("aria-expanded", open ? "true" : "false");
          });
          qd.appendChild(btn);
          qd.appendChild(ans);
          prac.appendChild(qd);
        });
        body.appendChild(prac);
      }
      article.appendChild(body);

      gridEl.appendChild(article);
    });

    if (query.trim()) {
      countEl.textContent = "找到 " + list.length + " 张卡片";
    } else if (selected === "all") {
      countEl.textContent = "一共 " + list.length + " 张卡片";
    } else {
      countEl.textContent = selected + " · " + list.length + " 张";
    }
    emptyEl.style.display = list.length === 0 ? "block" : "none";
  }

  function render() { renderChips(); renderCards(); }

  searchEl.addEventListener("input", function () {
    query = searchEl.value;
    renderCards();
  });

  document.getElementById("clearSearch").addEventListener("click", function () {
    query = "";
    searchEl.value = "";
    selected = "all";
    render();
    searchEl.focus();
  });

  /* ---------- back to top ---------- */
  var toTop = document.getElementById("toTop");
  function onScroll() {
    if (window.scrollY > window.innerHeight) toTop.classList.add("show");
    else toTop.classList.remove("show");
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
  toTop.addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  /* ---------- lightbox ---------- */
  var lightbox = document.getElementById("lightbox");
  var lbImg = document.getElementById("lightboxImg");
  var lbTitle = document.getElementById("lightboxTitle");
  var lbCapTitle = document.getElementById("lightboxCapTitle");
  var lbCapPoints = document.getElementById("lightboxCapPoints");
  var lbIndex = 0;

  function showLb() {
    var card = currentList[lbIndex];
    if (!card) return;
    lbImg.src = card.image;
    lbImg.alt = card.title;
    lbTitle.textContent = card.title + "（" + (lbIndex + 1) + " / " + currentList.length + "）";
    lbCapTitle.textContent = card.title;
    lbCapPoints.textContent = card.points;
  }
  function openLightbox(idx) {
    lbIndex = idx;
    showLb();
    lightbox.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function stepLb(d) {
    if (!currentList.length) return;
    lbIndex = (lbIndex + d + currentList.length) % currentList.length;
    showLb();
  }
  function closeLightbox() {
    lightbox.classList.remove("open");
    lbImg.src = "";
    document.body.style.overflow = "";
  }
  document.getElementById("lbPrev").addEventListener("click", function (e) {
    e.stopPropagation(); stepLb(-1);
  });
  document.getElementById("lbNext").addEventListener("click", function (e) {
    e.stopPropagation(); stepLb(1);
  });
  document.getElementById("lightboxClose").addEventListener("click", function (e) {
    e.stopPropagation(); closeLightbox();
  });
  document.getElementById("lightboxStage").addEventListener("click", function (e) {
    if (e.target === e.currentTarget || e.target === lbImg) closeLightbox();
  });
  document.addEventListener("keydown", function (e) {
    if (!lightbox.classList.contains("open")) return;
    if (e.key === "Escape") closeLightbox();
    else if (e.key === "ArrowLeft") stepLb(-1);
    else if (e.key === "ArrowRight") stepLb(1);
  });

  /* ---------- topic viewer （专题：教程 iframe / 漫画翻页） ---------- */
  var COMIC_RAW_BASE = "https://raw.githubusercontent.com/bullshitAI52/mathmanhua123/main/";
  var viewer = document.getElementById("topicViewer");
  var viewerTitle = document.getElementById("viewerTitle");
  var viewerFrame = document.getElementById("viewerFrame");
  var comicStage = document.getElementById("comicStage");
  var comicImg = document.getElementById("comicImg");
  var comicNav = document.getElementById("comicNav");
  var comicPageNo = document.getElementById("comicPageNo");
  var comicPrev = document.getElementById("comicPrev");
  var comicNext = document.getElementById("comicNext");
  var topicCard = null;
  var comicPage = 0;

  function showComicPage() {
    if (!topicCard || !topicCard.pages) return;
    var name = topicCard.pages[comicPage];
    comicImg.src = COMIC_RAW_BASE + encodeURIComponent(name);
    comicImg.alt = "漫画数学 第 " + (comicPage + 1) + " 页";
    comicPageNo.textContent = "第 " + (comicPage + 1) + " / " + topicCard.pages.length + " 页";
    comicPrev.disabled = comicPage === 0;
    comicNext.disabled = comicPage >= topicCard.pages.length - 1;
    var next = topicCard.pages[comicPage + 1];
    if (next) {
      var pre = new Image();
      pre.src = COMIC_RAW_BASE + encodeURIComponent(next);
    }
    comicStage.scrollTop = 0;
  }
  function openTopic(card) {
    topicCard = card;
    viewerTitle.textContent = card.title;
    if (card.kind === "comic") {
      comicPage = 0;
      viewerFrame.style.display = "none";
      viewerFrame.removeAttribute("srcdoc");
      comicStage.style.display = "flex";
      comicNav.style.display = "flex";
      showComicPage();
    } else {
      comicStage.style.display = "none";
      comicNav.style.display = "none";
      comicImg.src = "";
      viewerFrame.style.display = "block";
      viewerFrame.srcdoc = card.html || "";
    }
    viewer.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeTopic() {
    viewer.classList.remove("open");
    viewerFrame.removeAttribute("srcdoc");
    comicImg.src = "";
    topicCard = null;
    document.body.style.overflow = "";
  }
  function stepComic(d) {
    if (!topicCard || topicCard.kind !== "comic") return;
    var n = Math.min(Math.max(comicPage + d, 0), topicCard.pages.length - 1);
    if (n !== comicPage) { comicPage = n; showComicPage(); }
  }
  comicPrev.addEventListener("click", function () { stepComic(-1); });
  comicNext.addEventListener("click", function () { stepComic(1); });
  document.getElementById("viewerClose").addEventListener("click", function () { closeTopic(); });
  document.addEventListener("keydown", function (e) {
    if (!viewer.classList.contains("open")) return;
    if (e.key === "Escape") closeTopic();
    else if (e.key === "ArrowLeft") stepComic(-1);
    else if (e.key === "ArrowRight") stepComic(1);
  });

  render();
})();
</script>
</body>
</html>
